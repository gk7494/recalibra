services:
  - type: web
    name: recalibra-backend
    env: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recalibra-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-vercel-domain.vercel.app,https://your-custom-domain.com
      - key: BENCHLING_API_KEY
        sync: false
      - key: BENCHLING_API_URL
        value: https://api.benchling.com/v2

databases:
  - name: recalibra-db
    plan: starter
    region: oregon

